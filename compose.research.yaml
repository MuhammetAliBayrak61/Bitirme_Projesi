services:
  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    command: standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /project/airflow
      LST_ROOT: /project
      LST_PYTHON: /opt/research/bin/python
      PGHOST: db
      PGUSER: lst
      PGDATABASE: lst
      PGPASSWORD: ${LST_DB_PASSWORD:?LST_DB_PASSWORD gerekli}
      DATABASE_URL: ""
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - .:/project
      - airflowdata:/opt/airflow
    depends_on:
      db:
        condition: service_healthy
volumes:
  airflowdata:
